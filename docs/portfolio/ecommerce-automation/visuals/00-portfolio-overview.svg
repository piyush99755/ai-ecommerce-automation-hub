<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0F172A; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#38BDF8"/>
    </marker>

    <!-- Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="engine-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#0F172A"/>

  <!-- Top Title Header -->
  <g transform="translate(80, 50)">
    <text x="0" y="32" fill="#FFFFFF" font-size="34" font-weight="900" tracking-tight="true">AI E-commerce Automation Hub</text>
    <text x="0" y="65" fill="#94A3B8" font-size="18" font-weight="500">Event-Driven Storefront, PostgreSQL Outbox &amp; Automated Business Workflows</text>
  </g>

  <!-- Status Badge Top Right -->
  <g transform="translate(1320, 50)">
    <rect width="200" height="42" rx="21" fill="#064E3B" stroke="#059669" stroke-width="1.5"/>
    <circle cx="28" cy="21" r="5" fill="#34D399"/>
    <text x="44" y="26" fill="#34D399" font-size="14" font-weight="800" letter-spacing="1">E2E VERIFIED</text>
  </g>

  <!-- SECTION 1: CORE 3-STEP PIPELINE (Top Row) -->
  
  <!-- Step 1: Customer Storefront -->
  <g transform="translate(80, 150)">
    <rect width="420" height="250" rx="20" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="2"/>
    <rect x="24" y="24" width="160" height="30" rx="8" fill="#0284C7" opacity="0.2"/>
    <text x="36" y="44" fill="#38BDF8" font-size="12" font-weight="800" letter-spacing="1">NEXT.JS 16 STOREFRONT</text>

    <text x="24" y="95" fill="#FFFFFF" font-size="24" font-weight="800">Customer Storefront</text>
    <text x="24" y="125" fill="#94A3B8" font-size="15" font-weight="400">Products • Shopping Cart • Checkout</text>

    <rect x="24" y="155" width="372" height="70" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="40" y="185" fill="#E2E8F0" font-size="14" font-weight="600">Customer Browses &amp; Pays</text>
    <text x="40" y="208" fill="#64748B" font-size="13">Direct server-side data &amp; Stripe Checkout</text>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 500 275 L 560 275" stroke="#38BDF8" stroke-width="3" marker-end="url(#arr-main)"/>

  <!-- Step 2: PostgreSQL & Outbox -->
  <g transform="translate(560, 150)">
    <rect width="420" height="250" rx="20" fill="url(#card-grad)" stroke="#34D399" stroke-width="2"/>
    <rect x="24" y="24" width="160" height="30" rx="8" fill="#059669" opacity="0.2"/>
    <text x="36" y="44" fill="#34D399" font-size="12" font-weight="800" letter-spacing="1">NEON POSTGRESQL</text>

    <text x="24" y="95" fill="#FFFFFF" font-size="24" font-weight="800">PostgreSQL &amp; Outbox</text>
    <text x="24" y="125" fill="#94A3B8" font-size="15" font-weight="400">Authoritative Data &amp; Event Log</text>

    <!-- Reliability Callout 1 -->
    <rect x="24" y="155" width="372" height="70" rx="12" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <rect x="40" y="170" width="160" height="22" rx="6" fill="#064E3B"/>
    <text x="48" y="185" fill="#34D399" font-size="11" font-weight="800">TRANSACTIONAL OUTBOX</text>
    <text x="40" y="210" fill="#CBD5E1" font-size="13">Guarantees zero lost order events</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 980 275 L 1040 275" stroke="#38BDF8" stroke-width="3" marker-end="url(#arr-main)"/>

  <!-- Step 3: n8n Automation Engine -->
  <g transform="translate(1040, 150)">
    <rect width="480" height="250" rx="20" fill="url(#engine-grad)" stroke="#A78BFA" stroke-width="2"/>
    <rect x="24" y="24" width="170" height="30" rx="8" fill="#6D28D9" opacity="0.2"/>
    <text x="36" y="44" fill="#A78BFA" font-size="12" font-weight="800" letter-spacing="1">N8N ORCHESTRATION</text>

    <text x="24" y="95" fill="#FFFFFF" font-size="24" font-weight="800">Automation Engine</text>
    <text x="24" y="125" fill="#94A3B8" font-size="15" font-weight="400">Workflows • Dispatches • Retries</text>

    <!-- Reliability Callouts 2 & 3 -->
    <g transform="translate(24, 155)">
      <rect width="210" height="70" rx="12" fill="#0F172A" stroke="#4C1D95" stroke-width="1"/>
      <rect x="12" y="14" width="170" height="20" rx="4" fill="#4C1D95"/>
      <text x="18" y="28" fill="#DDD6FE" font-size="10" font-weight="800">AT-LEAST-ONCE DELIVERY</text>
      <text x="12" y="52" fill="#94A3B8" font-size="12">Reliable Webhooks</text>
    </g>

    <g transform="translate(246, 155)">
      <rect width="210" height="70" rx="12" fill="#0F172A" stroke="#4C1D95" stroke-width="1"/>
      <rect x="12" y="14" width="170" height="20" rx="4" fill="#4C1D95"/>
      <text x="18" y="28" fill="#DDD6FE" font-size="10" font-weight="800">IDEMPOTENT PROCESSING</text>
      <text x="12" y="52" fill="#94A3B8" font-size="12">No Duplicate Orders</text>
    </g>
  </g>

  <!-- SECTION 2: AUTOMATED FAN-OUT SERVICES (Bottom Row) -->
  
  <!-- Main Downward Flow Path from n8n Engine -->
  <path d="M 1280 400 L 1280 470 L 180 470 L 180 520" fill="none" stroke="#A78BFA" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-down)"/>
  <path d="M 430 470 L 430 520" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-down)"/>
  <path d="M 680 470 L 680 520" fill="none" stroke="#FF7A59" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-down)"/>
  <path d="M 930 470 L 930 520" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-down)"/>
  <path d="M 1180 470 L 1180 520" fill="none" stroke="#FBBF24" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-down)"/>
  <path d="M 1430 470 L 1430 520" fill="none" stroke="#F43F5E" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-down)"/>

  <!-- Service 1: Stripe Payments -->
  <g transform="translate(80, 530)">
    <rect width="220" height="290" rx="16" fill="url(#card-grad)" stroke="#6366F1" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#4338CA"/>
    <!-- Card Icon -->
    <path d="M 32 40 H 56 M 32 46 H 48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    
    <text x="20" y="105" fill="#FFFFFF" font-size="18" font-weight="800">Stripe Payments</text>
    <text x="20" y="130" fill="#6366F1" font-size="13" font-weight="700">Payment Gateway</text>
    
    <text x="20" y="170" fill="#94A3B8" font-size="13" leading="18">
      <tspan x="20" dy="0">• Hosted Checkout</tspan>
      <tspan x="20" dy="22">• Webhook Signatures</tspan>
      <tspan x="20" dy="22">• Payment Verification</tspan>
    </text>
  </g>

  <!-- Service 2: Stock Decrements -->
  <g transform="translate(330, 530)">
    <rect width="220" height="290" rx="16" fill="url(#card-grad)" stroke="#10B981" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#047857"/>
    <!-- Box Icon -->
    <path d="M 34 36 L 44 31 L 54 36 L 44 41 Z M 34 36 V 48 L 44 53 V 41 M 54 36 V 48 L 44 53" stroke="#FFFFFF" stroke-width="2" fill="none"/>

    <text x="20" y="105" fill="#FFFFFF" font-size="18" font-weight="800">Inventory Control</text>
    <text x="20" y="130" fill="#10B981" font-size="13" font-weight="700">Stock Decrements</text>

    <text x="20" y="170" fill="#94A3B8" font-size="13" leading="18">
      <tspan x="20" dy="0">• Atomic Decrements</tspan>
      <tspan x="20" dy="22">• Concurrency Guards</tspan>
      <tspan x="20" dy="22">• Low-Stock Alerts</tspan>
    </text>
  </g>

  <!-- Service 3: HubSpot CRM -->
  <g transform="translate(580, 530)">
    <rect width="220" height="290" rx="16" fill="url(#card-grad)" stroke="#FF7A59" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#C2410C"/>
    <!-- User Icon -->
    <circle cx="44" cy="38" r="7" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M 34 52 C 34 45 38 43 44 43 C 50 43 54 45 54 52" stroke="#FFFFFF" stroke-width="2" fill="none"/>

    <text x="20" y="105" fill="#FFFFFF" font-size="18" font-weight="800">HubSpot CRM</text>
    <text x="20" y="130" fill="#FF7A59" font-size="13" font-weight="700">Customer Sync</text>

    <text x="20" y="170" fill="#94A3B8" font-size="13" leading="18">
      <tspan x="20" dy="0">• Contact Upserts</tspan>
      <tspan x="20" dy="22">• Deal Stage Updates</tspan>
      <tspan x="20" dy="22">• Order History Sync</tspan>
    </text>
  </g>

  <!-- Service 4: Resend Email -->
  <g transform="translate(830, 530)">
    <rect width="220" height="290" rx="16" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#0369A1"/>
    <!-- Mail Icon -->
    <rect x="32" y="36" width="24" height="16" rx="3" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <path d="M 32 38 L 44 46 L 56 38" stroke="#FFFFFF" stroke-width="2" fill="none"/>

    <text x="20" y="105" fill="#FFFFFF" font-size="18" font-weight="800">Resend Email</text>
    <text x="20" y="130" fill="#38BDF8" font-size="13" font-weight="700">Customer Emails</text>

    <text x="20" y="170" fill="#94A3B8" font-size="13" leading="18">
      <tspan x="20" dy="0">• Order Confirmation</tspan>
      <tspan x="20" dy="22">• Shipping Emails</tspan>
      <tspan x="20" dy="22">• Deduplicated Keys</tspan>
    </text>
  </g>

  <!-- Service 5: Shipping Dispatch -->
  <g transform="translate(1080, 530)">
    <rect width="220" height="290" rx="16" fill="url(#card-grad)" stroke="#FBBF24" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#B45309"/>
    <!-- Truck Icon -->
    <path d="M 30 48 H 52 M 32 38 H 46 L 54 44 V 48" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <circle cx="36" cy="50" r="3" fill="#FFFFFF"/>
    <circle cx="48" cy="50" r="3" fill="#FFFFFF"/>

    <text x="20" y="105" fill="#FFFFFF" font-size="18" font-weight="800">Fulfillment</text>
    <text x="20" y="130" fill="#FBBF24" font-size="13" font-weight="700">Shipping &amp; Delivery</text>

    <text x="20" y="170" fill="#94A3B8" font-size="13" leading="18">
      <tspan x="20" dy="0">• Carrier Dispatch</tspan>
      <tspan x="20" dy="22">• Tracking Numbers</tspan>
      <tspan x="20" dy="22">• Delivery Status</tspan>
    </text>
  </g>

  <!-- Service 6: Discord Alerts -->
  <g transform="translate(1330, 530)">
    <rect width="190" height="290" rx="16" fill="url(#card-grad)" stroke="#F43F5E" stroke-width="1.5"/>
    <rect x="20" y="20" width="48" height="48" rx="12" fill="#BE123C"/>
    <!-- Bell Icon -->
    <path d="M 44 34 C 40 34 36 37 36 42 V 48 H 52 V 42 C 52 37 48 34 44 34 Z M 42 52 C 42 53 43 54 44 54 C 45 54 46 53 46 52" stroke="#FFFFFF" stroke-width="2" fill="none"/>

    <text x="20" y="105" fill="#FFFFFF" font-size="18" font-weight="800">Discord Alerts</text>
    <text x="20" y="130" fill="#F43F5E" font-size="13" font-weight="700">Ops Reliability</text>

    <text x="20" y="170" fill="#94A3B8" font-size="13" leading="18">
      <tspan x="20" dy="0">• Low-Stock Warnings</tspan>
      <tspan x="20" dy="22">• Delivery Failure Alerts</tspan>
      <tspan x="20" dy="22">• Outbox Recovery</tspan>
    </text>
  </g>
</svg>
