<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0F172A; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A78BFA"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F87171"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="#0F172A"/>

  <!-- Header Bar -->
  <rect x="40" y="40" width="1520" height="90" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="82" fill="#F8FAFC" font-size="28" font-weight="800" letter-spacing="-0.5">Order Fulfillment &amp; Inventory Automation Lifecycle</text>
  <text x="70" y="110" fill="#94A3B8" font-size="15" font-weight="500">Atomic Database Transactions, Payment Gates, and Transactional Outbox Retries</text>
  
  <!-- Status Badge -->
  <rect x="1350" y="65" width="180" height="38" rx="8" fill="#FEF3C7" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="1370" cy="84" r="5" fill="#F59E0B"/>
  <text x="1385" y="89" fill="#FBBF24" font-size="13" font-weight="700" letter-spacing="0.5">IN DEVELOPMENT</text>

  <!-- High-Level Invariant Badges -->
  <g transform="translate(40, 155)">
    <rect width="360" height="42" rx="8" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1"/>
    <text x="15" y="26" fill="#38BDF8" font-size="13" font-weight="700">✓ Unpaid Orders Blocked (paymentStatus = PAID)</text>

    <rect x="380" width="370" height="42" rx="8" fill="#059669" fill-opacity="0.15" stroke="#34D399" stroke-width="1"/>
    <text x="395" y="26" fill="#34D399" font-size="13" font-weight="700">✓ Stock Mutated &amp; Outbox Committed Atomically</text>

    <rect x="770" width="370" height="42" rx="8" fill="#7C3AED" fill-opacity="0.15" stroke="#A78BFA" stroke-width="1"/>
    <text x="785" y="26" fill="#A78BFA" font-size="13" font-weight="700">✓ Outbox Engine with 5-Min Lease Recovery</text>

    <rect x="1160" width="400" height="42" rx="8" fill="#D97706" fill-opacity="0.15" stroke="#FBBF24" stroke-width="1"/>
    <text x="1175" y="26" fill="#FBBF24" font-size="13" font-weight="700">✓ Post-Commit Email &amp; Low-Stock Alerts</text>
  </g>

  <!-- ROW 1: Order Creation to Payment Gate (Top Flow) -->

  <!-- Step 1: Order Placed -->
  <g transform="translate(40, 230)">
    <rect width="340" height="260" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect width="340" height="38" rx="14" fill="#0284C7" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#38BDF8" font-size="14" font-weight="800">1. ORDER CREATION</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="16" font-weight="700">Customer Places Order</text>
    <text x="20" y="88" fill="#94A3B8" font-size="13">Endpoint: POST /api/orders</text>
    
    <rect x="20" y="105" width="300" height="135" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="30" y="130" fill="#CBD5E1" font-size="12" font-weight="600">Database Record Created:</text>
    <text x="30" y="150" fill="#94A3B8" font-size="12">• Order.status = <tspan fill="#F59E0B" font-weight="700">PENDING</tspan></text>
    <text x="30" y="168" fill="#94A3B8" font-size="12">• Order.paymentStatus = <tspan fill="#F59E0B" font-weight="700">PENDING</tspan></text>
    <text x="30" y="186" fill="#94A3B8" font-size="12">• Subtotal &amp; Total calculated from DB</text>
    <text x="30" y="204" fill="#94A3B8" font-size="12">• Inventory snapshot verified</text>
    <text x="30" y="222" fill="#38BDF8" font-size="11" font-weight="700">[IMPLEMENTED]</text>
  </g>

  <!-- Step 2: Stripe Checkout -->
  <g transform="translate(420, 230)">
    <rect width="350" height="260" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <rect width="350" height="38" rx="14" fill="#4338CA" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#818CF8" font-size="14" font-weight="800">2. STRIPE CHECKOUT SESSION</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="16" font-weight="700">Hosted Payment Gateway</text>
    <text x="20" y="88" fill="#94A3B8" font-size="13">Endpoint: POST /api/orders/[id]/checkout-session</text>
    
    <rect x="20" y="105" width="310" height="135" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="30" y="130" fill="#CBD5E1" font-size="12" font-weight="600">Stripe Integration Details:</text>
    <text x="30" y="150" fill="#94A3B8" font-size="12">• Generates Stripe Hosted Session URL</text>
    <text x="30" y="168" fill="#94A3B8" font-size="12">• Reuses active sessions (session reuse)</text>
    <text x="30" y="186" fill="#94A3B8" font-size="12">• Line items build from OrderItem DB</text>
    <text x="30" y="204" fill="#94A3B8" font-size="12">• Persists stripeCheckoutSessionId</text>
    <text x="30" y="222" fill="#818CF8" font-size="11" font-weight="700">[IMPLEMENTED]</text>
  </g>

  <!-- Step 3: Verified Webhook -->
  <g transform="translate(810, 230)">
    <rect width="360" height="260" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <rect width="360" height="38" rx="14" fill="#059669" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#34D399" font-size="14" font-weight="800">3. VERIFIED STRIPE WEBHOOK</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="16" font-weight="700">Raw Body Verification &amp; PK Lock</text>
    <text x="20" y="88" fill="#94A3B8" font-size="13">Endpoint: POST /api/webhooks/stripe</text>
    
    <rect x="20" y="105" width="320" height="135" rx="8" fill="#0F172A" stroke="#059669"/>
    <text x="30" y="128" fill="#34D399" font-size="12" font-weight="700">Atomic Database Transaction:</text>
    <text x="30" y="146" fill="#E2E8F0" font-size="12">1. Verifies Stripe webhook signature using raw request body</text>
    <text x="30" y="164" fill="#E2E8F0" font-size="12">2. Inserts StripeEvent.id (PK Dedupe)</text>
    <text x="30" y="182" fill="#E2E8F0" font-size="12">3. Updates <tspan fill="#34D399" font-weight="700">paymentStatus = PAID</tspan></text>
    <text x="30" y="200" fill="#E2E8F0" font-size="12">4. Atomically creates <tspan fill="#38BDF8" font-weight="700">PAYMENT_SUCCEEDED</tspan></text>
    <text x="30" y="218" fill="#34D399" font-size="11" font-weight="700">[IMPLEMENTED]</text>
  </g>

  <!-- Step 4: Fulfillment Payment Gate -->
  <g transform="translate(1210, 230)">
    <rect width="350" height="260" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="350" height="38" rx="14" fill="#D97706" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#FBBF24" font-size="14" font-weight="800">4. FULFILLMENT PAYMENT GATE</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="16" font-weight="700">Fulfillment Security Check</text>
    <text x="20" y="88" fill="#94A3B8" font-size="13">Endpoint: POST /api/internal/orders/[id]/process</text>
    
    <rect x="20" y="105" width="310" height="135" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="30" y="128" fill="#FBBF24" font-size="12" font-weight="700">Strict Safety Invariants:</text>
    <text x="30" y="146" fill="#F87171" font-size="12">• Rejects unpaid orders (HTTP 409)</text>
    <text x="30" y="164" fill="#CBD5E1" font-size="12">• Rejects non-PENDING status transitions</text>
    <text x="30" y="182" fill="#CBD5E1" font-size="12">• Verifies item stock before any mutation</text>
    <text x="30" y="200" fill="#CBD5E1" font-size="12">• Protected by X-Automation-Secret</text>
    <text x="30" y="218" fill="#FBBF24" font-size="11" font-weight="700">[IMPLEMENTED]</text>
  </g>

  <!-- ROW 2: Transactional Execution & Outbox Dispatcher (Bottom Flow) -->

  <!-- Step 5: Atomic DB Transaction -->
  <g transform="translate(40, 560)">
    <rect width="360" height="280" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <rect width="360" height="38" rx="14" fill="#059669" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#34D399" font-size="14" font-weight="800">5. ATOMIC DB TRANSACTION</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="16" font-weight="700">Stock Mutate &amp; Status Transition</text>
    <text x="20" y="88" fill="#94A3B8" font-size="13">Prisma 8 db.transaction Execution</text>
    
    <rect x="20" y="105" width="320" height="155" rx="8" fill="#1E293B" stroke="#059669"/>
    <text x="30" y="128" fill="#34D399" font-size="12" font-weight="700">Atomic Operations (Single Commit):</text>
    <text x="30" y="148" fill="#E2E8F0" font-size="12">1. Decrements Product.stock for all items</text>
    <text x="30" y="168" fill="#E2E8F0" font-size="12">2. Updates <tspan fill="#34D399" font-weight="700">Order.status = PROCESSING</tspan></text>
    <text x="30" y="188" fill="#E2E8F0" font-size="12">3. Creates <tspan fill="#38BDF8" font-weight="700">INVENTORY_UPDATED</tspan> OutboxEvent</text>
    <text x="30" y="208" fill="#E2E8F0" font-size="12">4. Dispatches Resend Email post-commit</text>
    <text x="30" y="235" fill="#34D399" font-size="11" font-weight="700">[IMPLEMENTED]</text>
  </g>

  <!-- Step 6: Outbox Delivery Engine -->
  <g transform="translate(430, 560)">
    <rect width="360" height="280" rx="14" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <rect width="360" height="38" rx="14" fill="#0369A1" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#38BDF8" font-size="14" font-weight="800">6. OUTBOX DISPATCHER ENGINE</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="16" font-weight="700">Durable At-Least-Once Delivery</text>
    <text x="20" y="88" fill="#94A3B8" font-size="13">Service: src/lib/outbox.ts</text>
    
    <rect x="20" y="105" width="320" height="155" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="30" y="128" fill="#38BDF8" font-size="12" font-weight="700">Engine Features:</text>
    <text x="30" y="148" fill="#CBD5E1" font-size="12">• 5-Min Lease Recovery (STALE_LEASE)</text>
    <text x="30" y="168" fill="#CBD5E1" font-size="12">• Exponential Backoff (+1m, +5m, +15m, +60m)</text>
    <text x="30" y="188" fill="#CBD5E1" font-size="12">• Max 5 attempts $\rightarrow$ FAILED (Dead Letter)</text>
    <text x="30" y="208" fill="#CBD5E1" font-size="12">• Stable eventId injected into payload</text>
    <text x="30" y="235" fill="#38BDF8" font-size="11" font-weight="700">[IMPLEMENTED]</text>
  </g>

  <!-- Step 7: n8n Automation Engine -->
  <g transform="translate(820, 560)">
    <rect width="360" height="280" rx="14" fill="#1E293B" stroke="#FF6D5A" stroke-width="1.5"/>
    <rect width="360" height="38" rx="14" fill="#FF6D5A" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#FF6D5A" font-size="14" font-weight="800">7. n8n WORKFLOW ORCHESTRATOR</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="16" font-weight="700">Workflow Branching &amp; Monitoring</text>
    <text x="20" y="88" fill="#94A3B8" font-size="13">Environment: Docker Container</text>
    
    <rect x="20" y="105" width="320" height="155" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="30" y="128" fill="#FF6D5A" font-size="12" font-weight="700">Orchestrated Slices:</text>
    <text x="30" y="148" fill="#CBD5E1" font-size="12">• Receives INVENTORY_UPDATED webhook</text>
    <text x="30" y="168" fill="#CBD5E1" font-size="12">• Queries GET /api/internal/inventory</text>
    <text x="30" y="188" fill="#CBD5E1" font-size="12">• Filters items where stock &lt; threshold</text>
    <text x="30" y="208" fill="#CBD5E1" font-size="12">• Deduplicates eventId before alert</text>
    <text x="30" y="235" fill="#FF6D5A" font-size="11" font-weight="700">[IMPLEMENTED IN n8n]</text>
  </g>

  <!-- Step 8: Post-Commit Handlers -->
  <g transform="translate(1210, 560)">
    <rect width="350" height="280" rx="14" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5"/>
    <rect width="350" height="38" rx="14" fill="#7C3AED" fill-opacity="0.2"/>
    <text x="20" y="25" fill="#A78BFA" font-size="14" font-weight="800">8. DOWNSTREAM ALERTS &amp; EMAILS</text>
    <text x="20" y="65" fill="#F8FAFC" font-size="16" font-weight="700">Operations &amp; Customer Handlers</text>
    <text x="20" y="88" fill="#94A3B8" font-size="13">Services: Resend &amp; Discord</text>
    
    <rect x="20" y="105" width="310" height="155" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="30" y="128" fill="#A78BFA" font-size="12" font-weight="700">Dispatched Outputs:</text>
    <text x="30" y="148" fill="#FB7185" font-size="12">• Resend Order Processing Email (Customer)</text>
    <text x="30" y="168" fill="#818CF8" font-size="12">• Discord Low-Stock Alert (Operations)</text>
    <text x="30" y="188" fill="#CBD5E1" font-size="12">• PII Isolation: No email/phone in Discord</text>
    <text x="30" y="208" fill="#CBD5E1" font-size="12">• Best-effort email delivery post-commit</text>
    <text x="30" y="235" fill="#A78BFA" font-size="11" font-weight="700">[IMPLEMENTED]</text>
  </g>

  <!-- Flow Connector Lines -->
  <!-- Row 1: Step 1 -> Step 2 -->
  <path d="M 380 360 L 420 360" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <!-- Row 1: Step 2 -> Step 3 -->
  <path d="M 770 360 L 810 360" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <!-- Row 1: Step 3 -> Step 4 -->
  <path d="M 1170 360 L 1210 360" stroke="#34D399" stroke-width="2.5" marker-end="url(#arr-green)"/>
  
  <!-- Row Transition: Step 4 (Top Right) -> Step 5 (Bottom Left) -->
  <path d="M 1385 490 L 1385 520 L 220 520 L 220 560" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Row 2: Step 5 -> Step 6 -->
  <path d="M 400 700 L 430 700" stroke="#34D399" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <!-- Row 2: Step 6 -> Step 7 -->
  <path d="M 790 700 L 820 700" stroke="#38BDF8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <!-- Row 2: Step 7 -> Step 8 -->
  <path d="M 1180 700 L 1210 700" stroke="#FF6D5A" stroke-width="2.5" marker-end="url(#arr-purple)"/>

</svg>
