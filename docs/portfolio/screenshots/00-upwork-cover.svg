<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0F172A; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-cover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="kbd-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg-cover)"/>

  <!-- Subtle ambient glow circle behind card -->
  <circle cx="1180" cy="450" r="350" fill="#6366F1" opacity="0.12" filter="blur(60px)"/>

  <!-- LEFT COLUMN: BRANDING & TECH STACK -->
  <g transform="translate(100, 160)">
    <!-- Top Pill -->
    <rect width="240" height="38" rx="19" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="24" cy="19" r="5" fill="#34D399"/>
    <text x="40" y="24" fill="#A5B4FC" font-size="13" font-weight="800" letter-spacing="1">E2E VERIFIED AUTOMATION</text>

    <!-- Large Headline -->
    <text x="0" y="110" fill="#FFFFFF" font-size="52" font-weight="900" letter-spacing="-1">AI E-commerce</text>
    <text x="0" y="170" fill="#FFFFFF" font-size="52" font-weight="900" letter-spacing="-1">Automation Hub</text>

    <!-- Subtitle -->
    <text x="0" y="225" fill="#94A3B8" font-size="24" font-weight="500">Automated Commerce Operations</text>

    <!-- Tech Stack Row -->
    <g transform="translate(0, 270)">
      <text x="0" y="0" fill="#64748B" font-size="12" font-weight="800" letter-spacing="1.5">INTEGRATED TECH STACK</text>
      
      <!-- Badges -->
      <g transform="translate(0, 15)">
        <!-- Stripe -->
        <rect x="0" y="0" width="110" height="42" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
        <text x="55" y="26" fill="#818CF8" font-size="16" font-weight="800" text-anchor="middle">Stripe</text>

        <!-- n8n -->
        <rect x="125" y="0" width="100" height="42" rx="10" fill="#1E293B" stroke="#FF6D5A" stroke-width="1.5"/>
        <text x="175" y="26" fill="#FF6D5A" font-size="16" font-weight="800" text-anchor="middle">n8n</text>

        <!-- HubSpot -->
        <rect x="240" y="0" width="120" height="42" rx="10" fill="#1E293B" stroke="#FF7A59" stroke-width="1.5"/>
        <text x="300" y="26" fill="#FF7A59" font-size="16" font-weight="800" text-anchor="middle">HubSpot</text>

        <!-- PostgreSQL -->
        <rect x="375" y="0" width="145" height="42" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
        <text x="447" y="26" fill="#34D399" font-size="16" font-weight="800" text-anchor="middle">PostgreSQL</text>
      </g>
    </g>

    <!-- Core Capabilities Callout -->
    <g transform="translate(0, 390)">
      <rect width="520" height="50" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <text x="25" y="31" fill="#CBD5E1" font-size="16" font-weight="700">
        Payments <tspan fill="#6366F1">•</tspan> Inventory <tspan fill="#6366F1">•</tspan> CRM <tspan fill="#6366F1">•</tspan> Fulfillment
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: PRODUCT CARD PREVIEW MOCK -->
  <g transform="translate(860, 130)">
    <!-- Container Card -->
    <rect width="640" height="640" rx="28" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="2"/>

    <!-- Product Image Stage (Top half) -->
    <g transform="translate(30, 30)">
      <rect width="580" height="340" rx="20" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      
      <!-- Keyboard Vector Illustration -->
      <g transform="translate(90, 50)">
        <rect x="0" y="0" width="400" height="200" rx="16" fill="url(#kbd-grad)" stroke="#6366F1" stroke-width="2.5"/>
        <!-- Keys -->
        <g fill="#475569">
          <rect x="20" y="20" width="30" height="25" rx="4" fill="#6366F1"/>
          <rect x="58" y="20" width="30" height="25" rx="4"/>
          <rect x="96" y="20" width="30" height="25" rx="4"/>
          <rect x="134" y="20" width="30" height="25" rx="4"/>
          <rect x="172" y="20" width="30" height="25" rx="4"/>
          <rect x="210" y="20" width="30" height="25" rx="4"/>
          <rect x="248" y="20" width="30" height="25" rx="4"/>
          <rect x="286" y="20" width="30" height="25" rx="4"/>
          <rect x="324" y="20" width="56" height="25" rx="4" fill="#A855F7"/>

          <rect x="20" y="55" width="45" height="25" rx="4" fill="#0EA5E9"/>
          <rect x="73" y="55" width="30" height="25" rx="4"/>
          <rect x="111" y="55" width="30" height="25" rx="4"/>
          <rect x="149" y="55" width="30" height="25" rx="4"/>
          <rect x="187" y="55" width="30" height="25" rx="4"/>
          <rect x="225" y="55" width="30" height="25" rx="4"/>
          <rect x="263" y="55" width="30" height="25" rx="4"/>
          <rect x="301" y="55" width="79" height="25" rx="4" fill="#0EA5E9"/>

          <rect x="20" y="90" width="55" height="25" rx="4" fill="#10B981"/>
          <rect x="83" y="90" width="30" height="25" rx="4"/>
          <rect x="121" y="90" width="30" height="25" rx="4"/>
          <rect x="159" y="90" width="30" height="25" rx="4"/>
          <rect x="197" y="90" width="30" height="25" rx="4"/>
          <rect x="235" y="90" width="30" height="25" rx="4"/>
          <rect x="273" y="90" width="107" height="25" rx="4" fill="#10B981"/>

          <!-- Spacebar Row -->
          <rect x="20" y="125" width="60" height="30" rx="4"/>
          <rect x="88" y="125" width="40" height="30" rx="4"/>
          <rect x="136" y="125" width="140" height="30" rx="4" fill="#6366F1"/>
          <rect x="284" y="125" width="40" height="30" rx="4"/>
          <rect x="332" y="125" width="48" height="30" rx="4"/>
        </g>
      </g>

      <!-- Overlay In Stock Badge -->
      <g transform="translate(450, 20)">
        <rect width="110" height="34" rx="17" fill="#064E3B" stroke="#059669" stroke-width="1"/>
        <circle cx="20" cy="17" r="4" fill="#34D399"/>
        <text x="34" y="22" fill="#34D399" font-size="13" font-weight="800">In Stock</text>
      </g>
    </g>

    <!-- Product Meta Info (Bottom half) -->
    <g transform="translate(50, 400)">
      <rect width="110" height="28" rx="6" fill="#1E1B4B"/>
      <text x="55" y="19" fill="#818CF8" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">WORKSPACE</text>

      <text x="0" y="65" fill="#FFFFFF" font-size="30" font-weight="900">Wireless Mechanical Keyboard</text>
      <text x="0" y="95" fill="#94A3B8" font-size="16" font-weight="400">Customizable RGB Backlighting &amp; Hot-Swappable Switches</text>

      <!-- Price & CTA Row -->
      <g transform="translate(0, 130)">
        <text x="0" y="32" fill="#64748B" font-size="12" font-weight="800" letter-spacing="1">PRICE</text>
        <text x="0" y="68" fill="#FFFFFF" font-size="40" font-weight="900">$129.99</text>

        <!-- CTA Button -->
        <g transform="translate(320, 15)">
          <rect width="220" height="56" rx="16" fill="url(#btn-grad)"/>
          <text x="110" y="34" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">Add to Cart →</text>
        </g>
      </g>
    </g>
  </g>
</svg>
