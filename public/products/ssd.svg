<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-ssd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-ssd)" />
  <!-- SSD Body -->
  <rect x="130" y="80" width="140" height="140" rx="18" fill="#334155" stroke="#38BDF8" stroke-width="2" />
  <rect x="150" y="100" width="100" height="100" rx="12" fill="#1E293B" />
  <!-- Logo / Speed graphic -->
  <circle cx="200" cy="150" r="25" fill="none" stroke="#38BDF8" stroke-width="3" />
  <path d="M 190 150 L 210 150 M 200 140 L 200 160" stroke="#38BDF8" stroke-width="3" />
  <!-- Port -->
  <rect x="180" y="215" width="40" height="8" rx="3" fill="#0EA5E9" />
  <text x="200" y="260" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle" font-family="sans-serif">Portable SSD 1TB</text>
</svg>
