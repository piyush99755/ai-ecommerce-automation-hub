<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-stand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-stand)" />
  <!-- Stand legs -->
  <path d="M 100 210 L 160 110 L 260 110 L 300 210" fill="none" stroke="#94A3B8" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Riser arms -->
  <path d="M 160 110 L 110 70 M 260 110 L 210 70" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" />
  <!-- Stoppers -->
  <rect x="105" y="62" width="12" height="15" rx="3" fill="#0EA5E9" />
  <rect x="205" y="62" width="12" height="15" rx="3" fill="#0EA5E9" />
  <text x="200" y="260" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle" font-family="sans-serif">Aluminum Laptop Stand</text>
</svg>
