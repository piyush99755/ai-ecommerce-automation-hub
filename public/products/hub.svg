<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg-hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-hub)" />
  <!-- Cable -->
  <path d="M 120 150 Q 80 150 80 100" stroke="#64748B" stroke-width="8" fill="none" stroke-linecap="round" />
  <!-- USB Plug -->
  <rect x="68" y="70" width="24" height="35" rx="4" fill="#475569" stroke="#94A3B8" stroke-width="1.5" />
  <!-- Hub Body -->
  <rect x="120" y="100" width="200" height="100" rx="16" fill="#334155" stroke="#10B981" stroke-width="2" />
  <!-- Ports -->
  <rect x="150" y="130" width="25" height="10" rx="2" fill="#10B981" />
  <rect x="190" y="130" width="25" height="10" rx="2" fill="#10B981" />
  <rect x="230" y="130" width="25" height="10" rx="2" fill="#10B981" />
  <rect x="270" y="130" width="30" height="12" rx="3" fill="#6366F1" />

  <rect x="150" y="160" width="40" height="8" rx="2" fill="#94A3B8" />
  <rect x="205" y="160" width="40" height="5" rx="1" fill="#94A3B8" />
  <text x="200" y="260" fill="#94A3B8" font-size="14" font-weight="600" text-anchor="middle" font-family="sans-serif">USB-C Charging Hub</text>
</svg>
